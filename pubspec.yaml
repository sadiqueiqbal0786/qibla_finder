name: qibla_finder
description: "A new Flutter project."
publish_to: 'none'
version: 2.1.2+11

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  geocoding: ^5.0.0
  geomag: ^0.3.0
  geolocator: ^14.0.3
  intl: ^0.20.3
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  timezone_finder: ^0.2.0
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.34.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # The compass dial and needle are vector-drawn (see
    # lib/widgets/qibla_compass.dart); only the launcher/brand icons ship.
    - assets/icon/