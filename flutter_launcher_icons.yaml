# Regenerate the source PNGs with:  flutter test tool/generate_icon.dart
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  # Adaptive icon: Android masks the outer edge, so the glyph lives in its own
  # foreground layer scaled into the safe zone.
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Android 13+ themed icons.
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0E2C1E"
    theme_color: "#0E2C1E"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
