plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android Gradle Plugin.
    // Kotlin is applied by the Flutter Gradle Plugin itself (built-in Kotlin migration).
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is read from android/key.properties (gitignored) so that credentials
// are never committed. When the file is absent the build falls back to the debug key so
// that `flutter build` still completes locally.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties['storeFile'] != null &&
        rootProject.file(keystoreProperties['storeFile']).exists()

android {
    namespace "com.example.qibla_finder"
    compileSdk 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications (java.time backport below API 26).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.qibla_finder"
        minSdk 24
        targetSdk 37
        // Sourced from `version:` in pubspec.yaml (1.3.3+4 -> versionName 1.3.3, versionCode 4).
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    // flutter_local_notifications >= 18 requires desugar_jdk_libs 2.1.4+.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
